<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#101726" />
      <stop offset="100%" stop-color="#0d111a" />
    </linearGradient>

    <!-- Neon Cyberpunk Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Dot Pattern -->
    <pattern id="gridDots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#00F0FF" fill-opacity="0.12" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 900;
      font-size: 52px;
      letter-spacing: 6px;
      text-transform: uppercase;
    }
    .badge-text {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 2px;
      fill: #00F0FF;
    }
    .subtitle {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 500;
      font-size: 17px;
      letter-spacing: 3px;
      fill: #CBD5E1;
      text-transform: uppercase;
    }
    .terminal-text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-weight: 600;
      font-size: 14px;
      fill: #94A3B8;
    }
    .highlight-green {
      fill: #10B981;
    }
    .highlight-cyan {
      fill: #00F0FF;
    }
  </style>

  <!-- Card Background -->
  <rect x="5" y="5" width="890" height="230" rx="16" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="1.5" />

  <!-- Grid Pattern Overlay -->
  <rect x="5" y="5" width="890" height="230" rx="16" fill="url(#gridDots)" />

  <!-- Decorative Corner Accents -->
  <path d="M 25 15 L 15 15 L 15 25" stroke="#00F0FF" stroke-width="2.5" fill="none" opacity="0.8" />
  <path d="M 875 15 L 885 15 L 885 25" stroke="#EC4899" stroke-width="2.5" fill="none" opacity="0.8" />
  <path d="M 15 215 L 15 225 L 25 225" stroke="#00F0FF" stroke-width="2.5" fill="none" opacity="0.8" />
  <path d="M 885 215 L 885 225 L 875 225" stroke="#EC4899" stroke-width="2.5" fill="none" opacity="0.8" />

  <!-- Top Status Pill -->
  <g transform="translate(450, 42)">
    <rect x="-140" y="-14" width="280" height="26" rx="13" fill="#000000" fill-opacity="0.4" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="-118" cy="-1" r="4" fill="#10B981" />
    <circle cx="-118" cy="-1" r="7" fill="#10B981" fill-opacity="0.3" />
    <text x="5" y="3" text-anchor="middle" class="badge-text">STATUS: ACTIVE &amp; BUILDING</text>
  </g>

  <!-- Main Name Title -->
  <text x="450" y="118" text-anchor="middle" fill="url(#neonGradient)" class="title" filter="url(#subtleGlow)">RAJNIKANTH</text>

  <!-- Horizontal Tech Divider -->
  <g transform="translate(450, 140)">
    <line x1="-280" y1="0" x2="-20" y2="0" stroke="url(#neonGradient)" stroke-width="1" opacity="0.4" />
    <circle cx="0" cy="0" r="3" fill="#00F0FF" />
    <line x1="20" y1="0" x2="280" y2="0" stroke="url(#neonGradient)" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Subtitle -->
  <text x="450" y="168" text-anchor="middle" class="subtitle">
    AI Systems <tspan fill="#00F0FF">•</tspan> Autonomous Agents <tspan fill="#A855F7">•</tspan> Full-Stack Engineering
  </text>

  <!-- Terminal Footer Bar -->
  <g transform="translate(450, 204)">
    <text x="0" y="0" text-anchor="middle" class="terminal-text">
      <tspan class="highlight-cyan">dev://rajnikanth/blr</tspan>:<tspan fill="#8B5CF6">~</tspan>$ <tspan fill="#E2E8F0">stack --focus="agents, trading, high-scale"</tspan> <tspan class="highlight-green">✔</tspan>
    </text>
  </g>
</svg>
