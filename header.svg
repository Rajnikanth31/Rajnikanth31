<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0D1424" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <!-- Cyberpunk Neon Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#8B5CF6" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#EC4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Matrix Dot Grid -->
    <pattern id="gridDots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#00F0FF" fill-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0.15; }
      50% { opacity: 0.4; }
      100% { transform: translateY(240px); opacity: 0.15; }
    }
    .hud-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 900;
      font-size: 54px;
      letter-spacing: 7px;
      text-transform: uppercase;
    }
    .hud-tag {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 2px;
      fill: #00F0FF;
    }
    .hud-sub {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 3px;
      fill: #E2E8F0;
      text-transform: uppercase;
    }
    .term-code {
      font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
      font-weight: 600;
      font-size: 13.5px;
      fill: #94A3B8;
    }
    .accent-cyan { fill: #00F0FF; }
    .accent-pink { fill: #EC4899; }
    .accent-green { fill: #10B981; }
    .accent-purple { fill: #A855F7; }
  </style>

  <!-- Container Box -->
  <rect x="5" y="5" width="910" height="250" rx="14" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="1.5" />

  <!-- Background Cyber Dot Grid -->
  <rect x="5" y="5" width="910" height="250" rx="14" fill="url(#gridDots)" />

  <!-- Corner Brackets (HUD Cyberpunk) -->
  <path d="M 12 32 L 12 12 L 32 12" stroke="#00F0FF" stroke-width="2.5" fill="none" />
  <circle cx="12" cy="12" r="2" fill="#00F0FF" />
  <path d="M 908 32 L 908 12 L 888 12" stroke="#EC4899" stroke-width="2.5" fill="none" />
  <circle cx="908" cy="12" r="2" fill="#EC4899" />
  <path d="M 12 228 L 12 248 L 32 248" stroke="#00F0FF" stroke-width="2.5" fill="none" />
  <circle cx="12" cy="248" r="2" fill="#00F0FF" />
  <path d="M 908 228 L 908 248 L 888 248" stroke="#EC4899" stroke-width="2.5" fill="none" />
  <circle cx="908" cy="248" r="2" fill="#EC4899" />

  <!-- System HUD Header Bar -->
  <g transform="translate(460, 36)">
    <rect x="-190" y="-13" width="380" height="26" rx="13" fill="#050811" fill-opacity="0.8" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.5" />
    <!-- Live Pulse Dot -->
    <circle cx="-165" cy="0" r="4" fill="#10B981" />
    <circle cx="-165" cy="0" r="7" fill="#10B981" fill-opacity="0.25" />
    <text x="10" y="4" text-anchor="middle" class="hud-tag">SYSTEM ONLINE // NODE: BLR-080 // ARCH: AGENTIC</text>
  </g>

  <!-- Side Tech Deco Lines -->
  <g opacity="0.3">
    <line x1="40" y1="125" x2="110" y2="125" stroke="#00F0FF" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="115" cy="125" r="2" fill="#00F0FF" />
    <circle cx="805" cy="125" r="2" fill="#EC4899" />
    <line x1="810" y1="125" x2="880" y2="125" stroke="#EC4899" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Main Hero Name -->
  <text x="460" y="118" text-anchor="middle" fill="url(#neonGradient)" class="hud-title" filter="url(#subtleGlow)">RAJNIKANTH</text>

  <!-- Dynamic Divider with Center Crystal -->
  <g transform="translate(460, 142)">
    <line x1="-310" y1="0" x2="-28" y2="0" stroke="url(#neonGradient)" stroke-width="1.2" opacity="0.4" />
    <!-- Center Diamond -->
    <polygon points="0,-4 5,0 0,4 -5,0" fill="#00F0FF" filter="url(#subtleGlow)" />
    <line x1="28" y1="0" x2="310" y2="0" stroke="url(#neonGradient)" stroke-width="1.2" opacity="0.4" />
  </g>

  <!-- Subtitle Specialization -->
  <text x="460" y="172" text-anchor="middle" class="hud-sub">
    AI Systems <tspan fill="#00F0FF">◈</tspan> Autonomous Agents <tspan fill="#A855F7">◈</tspan> Algorithmic Engineering
  </text>

  <!-- Interactive Terminal Footprint -->
  <g transform="translate(460, 214)">
    <rect x="-260" y="-14" width="520" height="28" rx="6" fill="#060A14" fill-opacity="0.75" stroke="#334155" stroke-width="0.8" />
    <text x="0" y="4" text-anchor="middle" class="term-code">
      <tspan class="accent-cyan">rajnikanth</tspan><tspan fill="#64748B">@</tspan><tspan class="accent-pink">core</tspan><tspan fill="#64748B">:</tspan><tspan class="accent-purple">~/workspace</tspan><tspan fill="#64748B">$</tspan> <tspan fill="#F8FAFC">deploy --system="intelligent-agents" --live</tspan> <tspan class="accent-green">✔</tspan>
    </text>
  </g>
</svg>
